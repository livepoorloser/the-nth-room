name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Prepare static site
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p _site
          cp -R assets courses index.html updates.html _site/
          sed -i "s|../videos/|https://media.githubusercontent.com/media/${SITE_REPOSITORY}/${SITE_BRANCH}/videos/|g" _site/courses/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
